<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="nav">
    <nav id="navbar">
        <p id="logo">MY DASHBOARD</p>

        <a href="index.html" class="links">Home</a>
        <a href="courses.html" class="links">Courses</a>
        <a href="about.html" class="links">About</a>
        <a href="contact.html" class="links">Contact</a>
    </nav>
    </header>
    <div class="layout">
<aside class="sidebar">
<a href="index.html" class="link">Dashboard</a>
<a href =courses.html class="link">My Courses</a>
<a href="assignment.html" class="link">Assignments</a>
<a href =settings.html class="link">Settings</a>
</aside>
<main id="settings">

            <h1>Settings</h1>
            <p>Manage your account preferences.</p>

            <!-- Profile Settings -->
            <section class="setting-section">
                <h2>Profile Settings</h2>

                <label>Full Name</label>
                <input type="text" id="full-name" placeholder="Enter your name">

                <label>Email Address</label>
                <input type="email" id="user-email" placeholder="Enter your email">

                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username">

                <button id="update-profile">Update Profile</button>
            </section>

            <!-- Password Settings -->
            <section class="setting-section">
                <h2>Password Settings</h2>

                <label>Current Password</label>
                <input type="password" id="current-password" placeholder="Current password">

                <label>New Password</label>
                <input type="password" id="new-password" placeholder="New password">

                <label>Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm password">

                <button id="change-password">Change Password</button>
            </section>

            <!-- Notification Settings -->
            <section class="setting-section">
                <h2>Notification Settings</h2>

                <label>
                    <input type="checkbox" id="email-notifications">
                    Email Notifications
                </label>

                <label>
                    <input type="checkbox" id="assignment-reminders">
                    Assignment Reminders
                </label>

                <label>
                    <input type="checkbox" id="course-updates">
                    Course Updates
                </label>
            </section>

            <!-- Appearance Settings -->
            <section class="setting-section">
                <h2>Appearance</h2>

                <label>Select Theme</label>

                <select id="theme">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>

                <button id="save-settings">Save Settings</button>
            </section>

        </main>
<p id="settings-message"></p>
    </div>
<script src="script.js"></script>
</body>
</html>
